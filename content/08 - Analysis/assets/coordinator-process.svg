<svg width="100%" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg">
<title>กระบวนการที่ผู้รับผิดชอบต้องทำ 6 ขั้น</title>
<desc>ขั้นตอนของผู้รับผิดชอบ: เตรียมชุดประเมิน แจ้งผู้ประเมิน ดำเนินการประเมิน รวบเอกสาร ให้คะแนน และรวมผลรายงาน</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.t{font-size:14px;fill:#2C2C2A;}
.th{font-size:14px;font-weight:500;fill:#04342C;}
.ts{font-size:12px;fill:#0F6E56;}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="140" y="40" width="400" height="52" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="340" y="62" text-anchor="middle">1 · เตรียมชุดประเมิน</text>
<text class="ts" x="340" y="80" text-anchor="middle">ฟอร์ม · task/scenario · เอกสาร blind · gold-set</text>
<line x1="340" y1="94" x2="340" y2="112" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="140" y="114" width="400" height="52" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="340" y="136" text-anchor="middle">2 · แจ้งผู้ประเมิน</text>
<text class="ts" x="340" y="154" text-anchor="middle">วัตถุประสงค์ · วิธีตอบ · consent (PDPA) · blinding</text>
<line x1="340" y1="168" x2="340" y2="186" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="140" y="188" width="400" height="52" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="340" y="210" text-anchor="middle">3 · ดำเนินการประเมิน</text>
<text class="ts" x="340" y="228" text-anchor="middle">A ใช้ระบบ · B blind review · C วัดเทคนิค</text>
<line x1="340" y1="242" x2="340" y2="260" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="140" y="262" width="400" height="52" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="340" y="284" text-anchor="middle">4 · รวบเอกสาร/ข้อมูล</text>
<text class="ts" x="340" y="302" text-anchor="middle">ฟอร์มครบทุกคน · บันทึก · ไฟล์ผลระบบ · baseline</text>
<line x1="340" y1="316" x2="340" y2="334" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="140" y="336" width="400" height="52" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="340" y="358" text-anchor="middle">5 · ให้คะแนน/คำนวณ</text>
<text class="ts" x="340" y="376" text-anchor="middle">ตามสูตร/เกณฑ์เฉพาะแต่ละฟอร์ม</text>
<line x1="340" y1="390" x2="340" y2="408" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="140" y="410" width="400" height="52" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="340" y="432" text-anchor="middle">6 · รวมผล + รายงาน</text>
<text class="ts" x="340" y="450" text-anchor="middle">ค่าเฉลี่ย · IRR · ระบุข้อจำกัด → ส่ง PI</text>
</svg>
