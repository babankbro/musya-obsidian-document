<svg width="100%" viewBox="0 0 680 470" role="img" xmlns="http://www.w3.org/2000/svg">
<title>กลุ่มและจำนวนผู้ประเมินรายฟอร์ม — รวม 58 คน</title>
<desc>ผู้ประเมินรวม 58 คน: กลุ่ม A ผู้ใช้ 53 คน ประเมินฟอร์ม 1-5,9,10 กลุ่ม B ผู้เชี่ยวชาญ 3 คน ประเมินฟอร์ม 6,8 กลุ่ม C ทีมเทคนิค 2 คน ประเมินฟอร์ม 7,8</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.t{font-size:14px;fill:#2C2C2A;}
.ts{font-size:12px;fill:#5F5E5A;}
.hd{font-size:14px;font-weight:500;}
.hs{font-size:12px;}
.box{fill:#F7F6F2;stroke:#C9C7BE;stroke-width:1;}
</style>

<rect class="box" x="40" y="40" width="600" height="30" rx="4"/>
<text class="t" x="52" y="60" text-anchor="start" style="font-weight:500">จำนวนผู้ประเมินรวม = 58 คน</text>
<text class="ts" x="628" y="60" text-anchor="end">EU 43 · DM 10 · EX 3 · TE 2</text>

<g>
<rect x="40" y="82" width="600" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="hd" x="52" y="102" text-anchor="start" fill="#04342C">กลุ่ม A · ผู้ใช้ปลายทาง (EU+DM)</text>
<text class="hs" x="628" y="102" text-anchor="end" fill="#0F6E56">53 คน · การรับรู้</text>
</g>
<rect class="box" x="40" y="120" width="141" height="34" rx="4"/><text class="t" x="110" y="135" text-anchor="middle">1 · Demographics</text><text class="ts" x="110" y="148" text-anchor="middle">53 คน</text>
<rect class="box" x="193" y="120" width="141" height="34" rx="4"/><text class="t" x="263" y="135" text-anchor="middle">2 · SUS</text><text class="ts" x="263" y="148" text-anchor="middle">53 คน</text>
<rect class="box" x="346" y="120" width="141" height="34" rx="4"/><text class="t" x="416" y="135" text-anchor="middle">3 · UEQ</text><text class="ts" x="416" y="148" text-anchor="middle">53 คน</text>
<rect class="box" x="499" y="120" width="141" height="34" rx="4"/><text class="t" x="569" y="135" text-anchor="middle">4 · NASA-TLX</text><text class="ts" x="569" y="148" text-anchor="middle">53 คน</text>
<rect class="box" x="40" y="160" width="192" height="34" rx="4"/><text class="t" x="136" y="175" text-anchor="middle">5 · TAM3 (+Trust)</text><text class="ts" x="136" y="188" text-anchor="middle">53 คน</text>
<rect class="box" x="244" y="160" width="192" height="34" rx="4"/><text class="t" x="340" y="175" text-anchor="middle">9 · Focus Group</text><text class="ts" x="340" y="188" text-anchor="middle">40 คน (subset) + FA</text>
<rect class="box" x="448" y="160" width="192" height="34" rx="4"/><text class="t" x="544" y="175" text-anchor="middle">10 · Think-Aloud</text><text class="ts" x="544" y="188" text-anchor="middle">30 คน (subset) + FA</text>

<g>
<rect x="40" y="212" width="600" height="30" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text class="hd" x="52" y="232" text-anchor="start" fill="#042C53">กลุ่ม B · ผู้เชี่ยวชาญอิสระ Blind (EX)</text>
<text class="hs" x="628" y="232" text-anchor="end" fill="#185FA5">3 คน · คุณภาพเอกสาร</text>
</g>
<rect class="box" x="40" y="250" width="294" height="34" rx="4"/><text class="t" x="187" y="265" text-anchor="middle">6 · Policy Quality Rubric</text><text class="ts" x="187" y="278" text-anchor="middle">EX 3 คน</text>
<rect class="box" x="346" y="250" width="294" height="34" rx="4"/><text class="t" x="493" y="265" text-anchor="middle">8 · Comparative Study</text><text class="ts" x="493" y="278" text-anchor="middle">EX 3 + TE 2 = 5 คน</text>

<g>
<rect x="40" y="302" width="600" height="30" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text class="hd" x="52" y="322" text-anchor="start" fill="#412402">กลุ่ม C · ทีมเทคนิค + Fact-checker (TE)</text>
<text class="hs" x="628" y="322" text-anchor="end" fill="#854F0B">2 คน · ตัวเลขเทคนิค</text>
</g>
<rect class="box" x="40" y="340" width="294" height="34" rx="4"/><text class="t" x="187" y="355" text-anchor="middle">7 · Benchmark Scenario</text><text class="ts" x="187" y="368" text-anchor="middle">TE 2 คน + auto metrics</text>
<rect class="box" x="346" y="340" width="294" height="34" rx="4"/><text class="t" x="493" y="355" text-anchor="middle">8 · Comparative Study</text><text class="ts" x="493" y="368" text-anchor="middle">ร่วมกับกลุ่ม B</text>

<rect class="box" x="40" y="392" width="600" height="56" rx="4"/>
<text class="ts" x="52" y="414" text-anchor="start">ฟอร์ม 9, 10 เป็น subset ของผู้ใช้ 53 คน (ไม่ใช่คนใหม่) · FA/HC เป็นทีมสนับสนุน ไม่นับรวม</text>
<text class="ts" x="52" y="434" text-anchor="start">DEV (ทีมพัฒนา) = ให้คำปรึกษา/รับทราบเท่านั้น · ไม่ให้คะแนนฟอร์มใด (กันอคติ)</text>
</svg>
